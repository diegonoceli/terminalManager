<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>maestri-like · canvas de terminais</title>
  <link rel="stylesheet" href="./vendor/xterm.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header id="toolbar">
    <div class="brand">
      <span class="logo">⌘</span>
      <span class="name">maestri-like</span>
    </div>
    <div class="tools">
      <button id="btn-new" class="btn primary" title="Criar novo terminal (N)">
        <span class="icon">+</span> Novo terminal
      </button>
      <div class="sep"></div>
      <button id="btn-zoom-in" class="btn" title="Zoom in (Cmd/Ctrl +)">+</button>
      <button id="btn-zoom-out" class="btn" title="Zoom out (Cmd/Ctrl -)">−</button>
      <button id="btn-zoom-reset" class="btn" title="Resetar zoom (Cmd/Ctrl 0)">1:1</button>
      <button id="btn-fit" class="btn" title="Ver tudo (V)">⤢</button>
      <button id="btn-center" class="btn" title="Centralizar em (0,0) (C)">◎</button>
      <div class="sep"></div>
      <div class="zoom-readout" id="zoom-readout">100%</div>
      <div class="sep"></div>
      <div class="bg-pick" title="Cor de fundo do canvas">
        <span>Fundo</span>
        <input type="color" id="canvas-bg" value="#f7f7f5" />
      </div>
    </div>
    <div class="status">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">conectando…</span>
    </div>
  </header>

  <main id="viewport">
    <div id="grid"></div>
    <div id="world"></div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="./vendor/xterm.min.js"></script>
  <script src="./vendor/xterm-addon-fit.js"></script>
  <script src="./js/canvas.js"></script>
  <script src="./js/terminal.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
