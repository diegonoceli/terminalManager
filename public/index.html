<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>terminal manager · canvas de terminais</title>
  <link rel="stylesheet" href="./vendor/xterm.min.css" />
  <link rel="stylesheet" href="./vendor/codemirror.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header id="toolbar">
    <div class="brand">
      <span class="logo">⌘</span>
      <span class="name">terminal manager</span>
    </div>
    <div class="tools">
      <div class="floors-control">
        <span style="font-size: 11.5px; font-weight: 600; color: var(--muted);">Floor:</span>
        <select id="floor-select" class="floor-select" title="Alternar Workspace/Floor"></select>
        <button id="btn-floor-new" class="btn icon-btn" title="Criar novo Floor" aria-label="Novo Floor">
          <svg class="icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        </button>
        <button id="btn-floor-hooks" class="btn icon-btn" title="⚡ Hooks de Ciclo de Vida (Setup/Run/Teardown)" aria-label="Hooks do Andar">
          ⚡
        </button>
        <button id="btn-floor-landing" class="btn icon-btn" title="🛬 Aterrissagem do Andar (Merge para Térreo)" aria-label="Aterrissar Andar" style="display:none;">
          🛬
        </button>
        <button id="btn-floor-rename" class="btn icon-btn" title="Renomear Floor atual" aria-label="Renomear Floor">
          <svg class="icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        </button>
        <button id="btn-floor-del" class="btn icon-btn" title="Excluir Floor atual" aria-label="Excluir Floor">
          <svg class="icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
        </button>
      </div>
      <div class="sep"></div>
      <button id="btn-new" class="btn primary" title="Criar novo terminal (N)">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" x2="20" y1="19" y2="19"></line></svg></span> Terminal
      </button>
      <button id="btn-new-web" class="btn" title="Adicionar Navegador Web">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg></span> Web
      </button>
      <button id="btn-new-device" class="btn" title="Adicionar Device Portal (Pixel 9 / iPhone)">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path></svg></span> Device
      </button>
      <button id="btn-new-editor" class="btn" title="Adicionar Editor de Código / VS Code">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg></span> Editor
      </button>
      <button id="btn-new-note" class="btn" title="Adicionar Nota (Markdown)">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"></path><path d="M15 3v5h5"></path></svg></span> Nota
      </button>
      <button id="btn-new-binder" class="btn" title="Adicionar Fichário (organizador espacial de notas)">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg></span> Fichário
      </button>
      <button id="btn-new-files" class="btn" title="Adicionar Árvore de Arquivos do projeto">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2A1 1 0 0 0 15 3h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"></path><path d="M20 21a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-2.9a1 1 0 0 1-.88-.55l-.42-.85a1 1 0 0 0-.92-.6H13a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"></path><path d="M3 5v14a2 2 0 0 0 2 2h3"></path><path d="M3 12h5"></path></svg></span> Arquivos
      </button>
      <button id="btn-new-text" class="btn" title="Adicionar nó de Texto">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" x2="15" y1="20" y2="20"></line><line x1="12" x2="12" y1="4" y2="20"></line></svg></span> Texto
      </button>
      <button id="btn-new-draw" class="btn" title="Adicionar nó de Desenho (esboço)">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></span> Desenho
      </button>
      <button id="btn-agents" class="btn" title="Configurações → Agentes (responsabilidades)">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></span> Agentes
      </button>
      <div class="sep"></div>
      <button id="btn-focus" class="btn toggle" title="Focar terminal ao clicar">
        <span class="icon"><svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="22" x2="18" y1="12" y2="12"></line><line x1="6" x2="2" y1="12" y2="12"></line><line x1="12" x2="12" y1="2" y2="6"></line><line x1="12" x2="12" y1="18" y2="22"></line></svg></span> Focar
      </button>
      <div class="sep"></div>
      <button id="btn-zoom-in" class="btn icon-btn" title="Zoom in (Cmd/Ctrl +)" aria-label="Zoom In">
        <svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y1="21" y2="16.65"></line><line x1="11" x2="11" y1="8" y2="14"></line><line x1="8" x2="14" y1="11" y2="11"></line></svg>
      </button>
      <button id="btn-zoom-out" class="btn icon-btn" title="Zoom out (Cmd/Ctrl -)" aria-label="Zoom Out">
        <svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y1="21" y2="16.65"></line><line x1="8" x2="14" y1="11" y2="11"></line></svg>
      </button>
      <button id="btn-zoom-reset" class="btn" title="Resetar zoom (Cmd/Ctrl 0)" style="font-size: 11px; font-weight: 600;">1:1</button>
      <button id="btn-fit" class="btn icon-btn" title="Ver tudo (V)" aria-label="Ver tudo">
        <svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
      </button>
      <button id="btn-center" class="btn icon-btn" title="Centralizar em (0,0) (C)" aria-label="Centralizar">
        <svg class="icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
      <div class="sep"></div>
      <div class="zoom-readout" id="zoom-readout">100%</div>
      <div class="sep"></div>
      <div class="bg-pick" title="Cor de fundo do canvas">
        <span>Fundo</span>
        <input type="color" id="canvas-bg" value="#f7f7f5" />
      </div>
      <select id="theme-select" class="floor-select theme-select" title="Tema do terminal ativo (Dracula/Catppuccin/Nord/Ghostty)">
        <option value="">Tema terminal</option>
        <option value="dracula">Dracula</option>
        <option value="catppuccin">Catppuccin</option>
        <option value="nord">Nord</option>
        <option value="__import__">Importar Ghostty (.json)…</option>
      </select>
    </div>
    <div class="status">
      <button id="btn-open-editor" class="btn editor-btn" title="Abrir pasta de trabalho no Editor (VS Code)">
        <span class="icon"><svg class="icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></span>
        <span>Abrir no Editor</span>
      </button>
      <div class="sep"></div>
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">conectando…</span>
    </div>
  </header>

  <aside id="sidebar" class="sidebar"></aside>

  <main id="viewport">
    <div id="grid"></div>
    <div id="world">
      <svg id="connections-layer" class="connections-layer">
        <defs>
          <linearGradient id="conn-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
      </svg>
    </div>
  </main>

  <div id="docks" class="docks"></div>
  <div id="minimap" class="minimap hidden"></div>
  <div id="badges-layer" class="badges-layer hidden"></div>

  <div id="toast" class="toast hidden"></div>
  <div id="modal-root" class="modal-root hidden"></div>

  <script src="./vendor/xterm.min.js"></script>
  <script src="./vendor/xterm-addon-fit.js"></script>
  <script src="./vendor/codemirror.min.js"></script>
  <script src="./vendor/codemirror/closebrackets.js"></script>
  <script src="./vendor/codemirror/matchbrackets.js"></script>
  <script src="./vendor/codemirror/searchcursor.js"></script>
  <script src="./vendor/codemirror/mode/javascript.js"></script>
  <script src="./vendor/codemirror/mode/xml.js"></script>
  <script src="./vendor/codemirror/mode/css.js"></script>
  <script src="./vendor/codemirror/mode/htmlmixed.js"></script>
  <script src="./vendor/codemirror/mode/markdown.js"></script>
  <script src="./vendor/codemirror/mode/clike.js"></script>
  <script src="./vendor/codemirror/mode/python.js"></script>
  <script src="./vendor/codemirror/mode/shell.js"></script>
  <script src="./vendor/marked.min.js"></script>
  <script src="./js/icons.js"></script>
  <script src="./js/canvas.js"></script>
  <script src="./js/connections.js"></script>
  <script src="./js/terminal.js"></script>
  <script src="./js/portals.js"></script>
  <script src="./js/workspace-sidebar.js"></script>
  <script src="./js/emoji-picker.js"></script>
  <script src="./js/notes.js"></script>
  <script src="./js/widgets/binder.js"></script>
  <script src="./js/filetree.js"></script>
  <script src="./js/widgets/textdraw.js"></script>
  <script src="./js/settings.js"></script>
  <script src="./js/floating-dock.js"></script>
  <script src="./js/floors.js"></script>
  <script src="./js/prompt-composer.js"></script>
  <script src="./js/batuta-search.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
